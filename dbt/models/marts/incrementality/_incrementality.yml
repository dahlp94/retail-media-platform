version: 2

models:
  - name: experiment_member_outcomes
    description: >
      Frozen v1 ITT member outcomes. Incrementality branch.
      For every assigned campaign-member pair, counts all purchases
      whose order date falls in the campaign window. Ignores
      source_campaign_id, exposure, clicks, and purchase_driver.
      Zero-purchase members remain with order_count=0, revenue_usd=0,
      is_converter=0.

      Grain: one row per campaign_id × member_id.

      Statistical uncertainty is not computed here.

      {{ doc('incrementality_vs_attribution') }}
    columns:
      - name: campaign_id
        tests:
          - not_null
      - name: member_id
        tests:
          - not_null
      - name: experiment_arm
        tests:
          - not_null
          - accepted_values:
              values: ['treatment', 'control']
      - name: order_count
        tests:
          - not_null
          - non_negative
      - name: revenue_usd
        tests:
          - not_null
          - non_negative
      - name: is_converter
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
    tests:
      - unique_combination:
          columns: [campaign_id, member_id]

  - name: experiment_lift_metrics
    description: >
      Frozen v1 campaign-level ITT *point estimates*.
      Grain: one row per campaign.

      Conversion, orders-per-member, and revenue-per-member lifts are
      treatment mean minus control mean. Incremental totals scale by
      treatment member count.

      Inferential uncertainty (Wald SE/CI/p-value for conversion;
      member-level bootstrap for orders and revenue) is added later by
      Python and must not be treated as dbt outputs.
    columns:
      - name: campaign_id
        tests:
          - not_null
          - unique
      - name: treatment_member_count
        tests:
          - not_null
          - non_negative
      - name: control_member_count
        tests:
          - not_null
          - non_negative
      - name: treatment_conversion_rate
        tests:
          - between_zero_and_one
      - name: control_conversion_rate
        tests:
          - between_zero_and_one
      - name: incremental_orders
      - name: incremental_revenue

  - name: segment_performance_metrics
    description: >
      Descriptive randomized subgroup analysis using the same
      campaign-window ITT outcomes as experiment_member_outcomes.
      Not CATE, uplift modeling, or individualized effects.

      Grain: one row per campaign × audience_segment_id × primary_geo_id,
      with treatment and control metrics as columns.
    columns:
      - name: campaign_id
        tests:
          - not_null
      - name: audience_segment_id
      - name: primary_geo_id
      - name: treatment_member_count
        tests:
          - non_negative
      - name: control_member_count
        tests:
          - non_negative
    tests:
      - unique_combination:
          columns: [campaign_id, audience_segment_id, primary_geo_id]

  - name: experiment_design_metadata
    description: >
      One experiment per campaign. Hypothesis, primary metric, alpha,
      and campaign dates. planned_power and planned_mde are null by
      design: they were never generated by the simulator.

      Holdout fraction is stored on assignment rows and health metrics,
      not on this table.

      Grain: one row per campaign / experiment.
    columns:
      - name: campaign_id
        tests:
          - not_null
          - unique
      - name: experiment_id
        tests:
          - not_null
      - name: alpha
        tests:
          - not_null
          - between_zero_and_one
      - name: primary_metric
        tests:
          - accepted_values:
              values: ['incremental_revenue']
      - name: start_date
        tests:
          - not_null
      - name: end_date
        tests:
          - not_null
    tests:
      - valid_date_window:
          start_column: start_date
          end_column: end_date

  - name: experiment_health_metrics
    description: >
      Experiment-integrity *inputs* at campaign grain: arm counts,
      intended holdout share, control exposure, duplicate assignments,
      outcome completeness, and pre-treatment covariate summaries.

      Python owns SRM chi-square p-values, SMDs, and PASS/WARN/FAIL.
      Re-running dbt rebuilds this table without those enrichment columns.
    columns:
      - name: campaign_id
        tests:
          - not_null
          - unique
      - name: assigned_member_count
        tests:
          - not_null
          - non_negative
      - name: intended_control_share
        tests:
          - not_null
          - between_zero_and_one
      - name: control_impressions
        tests:
          - not_null
          - non_negative
      - name: missing_member_outcome_count
        tests:
          - not_null
